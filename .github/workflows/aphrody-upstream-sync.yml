name: Aphrody upstream sync

# Merges alpinelinux/apk-tools master into the fork's master. The fork only
# adds .github/workflows/aphrody-* and PLAN.md, so a conflict means upstream
# touched those paths: the run fails and the branch is left as is.

permissions:
  contents: read

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: aphrody-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'aphrody-labs/apk-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows: a token
      # with the `workflow` scope goes in the APHRODY_SYNC_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
      - name: Merge upstream
        run: |
          git config user.name "aphrody-dev"
          git config user.email "contact@aphrody.com"
          git remote add upstream https://github.com/alpinelinux/apk-tools.git
          bun -e 'import { $ } from "bun"; await $`git fetch upstream master`; await $`git merge --no-edit upstream/master`; await $`git push origin HEAD:master`;'
